spring.application.name=prescription-scanner

# Activates application-local.properties in development.
# In production set SPRING_PROFILES_ACTIVE=prod and supply real values via env vars.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ───────────────────────────────────────────────────────────────
# NOTE: the database is "Medicine_scanner" and the USER is "postgres".
# (An earlier draft of this config put the database name in the username field,
# which fails with "password authentication failed for user Medicine_scanner".)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Medicine_scanner}
spring.datasource.username=${DB_USER:postgres}
# Supplied by application-local.properties, or by the DB_PASSWORD env var.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# "update" keeps the entities as the single source of truth (the Spring
# equivalent of sequelize.sync({ alter: true })).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Do not hold a DB connection open for the whole request.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Jackson 3 (which Spring Boot 4 ships) removed WRITE_DATES_AS_TIMESTAMPS and
# FAIL_ON_UNKNOWN_PROPERTIES: dates are ISO-8601 and unknown properties are
# ignored by default, which is what we want. Setting them here now fails startup.

# ── Multipart upload ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:20}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:20}MB

# ── Application settings ─────────────────────────────────────────────────────
# Private storage for scans. Never mapped to a static resource handler: files
# are only reachable through GET /api/files/{visitId}, which needs a JWT.
# Relative to the process working directory (the backend/ folder when run with
# mvnw spring-boot:run), so the stored scan paths in the database stay portable.
app.upload.dir=${UPLOAD_DIR:storage/uploads}
app.upload.max-mb=${MAX_UPLOAD_MB:20}
app.upload.allowed-types=image/jpeg,image/png,image/webp,application/pdf

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480
app.jwt.issuer=prescription-scanner
# Set COOKIE_SECURE=true (and same-site=None) when the app is served over HTTPS.
app.jwt.cookie-secure=${COOKIE_SECURE:false}
app.jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
# Tried automatically if the primary model is overloaded (HTTP 503).
app.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.8-flash}
app.gemini.timeout-ms=45000
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# DPDP Act 2023: when true, patient name/phone are masked in text sent to the AI.
# The scan image itself cannot be masked - see README.
app.ai.mask-pii=${AI_MASK_PII:false}

# Bootstrap admin. Created on startup if the email does not exist yet (an
# existing password is never overwritten). This account manages all users.
app.seed.admin-email=${SEED_ADMIN_EMAIL:bobbypaswan521@gmail.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Abcd@123}
app.seed.admin-name=${SEED_ADMIN_NAME:Bobby Paswan}
app.seed.enabled=true

# ── Rate limiting (in-memory) ────────────────────────────────────────────────
app.rate-limit.login-max=10
app.rate-limit.login-window-minutes=15
app.rate-limit.upload-max=20
app.rate-limit.upload-window-minutes=60

# ── CORS (Vite dev server) ───────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ── Logging ──────────────────────────────────────────────────────────────────
logging.file.name=logs/prescription-scanner.log
logging.level.com.prescriptionscanner=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
